/* Forge — dark, mobile-first, premium. */
:root {
  --bg: #0b0d10;
  --card: #14171c;
  --card2: #1a1e25;
  --line: #242932;
  --line2: #2e343e;
  --text: #f2f4f7;
  --mut: #8e96a3;
  --mut2: #939caa;
  --a1: #ff5f1f;
  --a2: #ffb321;
  --grad: linear-gradient(135deg, var(--a1), var(--a2));
  --ok: #3ddc97;
  --warn: #ffb321;
  --bad: #ff5468;
  --r: 18px;
  --r-sm: 12px;
  --tap: 48px;
  --tabh: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; overscroll-behavior-y: contain; }
body.no-scroll { overflow: hidden; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .4; cursor: default; }
:focus-visible { outline: 2px solid var(--a2); outline-offset: 2px; }
h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
h2 { font-size: 1.45rem; font-weight: 800; }
h3 { font-size: 1.05rem; font-weight: 700; }
h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--mut); margin: 22px 0 10px; font-weight: 700; }
h4 small { text-transform: none; letter-spacing: 0; font-weight: 500; }
p { margin: 8px 0; }
small { font-size: .78rem; }
.muted { color: var(--mut); }
.tiny { font-size: .78rem; }
.center { text-align: center; }
.ok-t { color: var(--ok); }
.warn-t { color: var(--warn); }
.danger-t { color: var(--bad) !important; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- shell ---------- */
#app { max-width: 640px; margin: 0 auto; padding-bottom: calc(var(--tabh) + var(--safe-b) + 24px); }
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 16px 10px; background: rgba(11, 13, 16, .82); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border-bottom: 1px solid rgba(255,255,255,.04); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 1.3rem; font-weight: 800; }
.brand-mark { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 4px 12px rgba(255, 95, 31, .35)); }
.icon-btn { width: var(--tap); height: var(--tap); display: inline-grid; place-items: center; border-radius: 14px; color: var(--text); flex: none; font-size: 1.3rem; line-height: 1; transition: background .15s; }
.icon-btn:active { background: rgba(255,255,255,.08); }
.icon-btn.sm { width: 40px; height: 40px; }
.view { padding: 12px 14px 8px; }
.view.enter { animation: viewIn .28s cubic-bezier(.2,.8,.2,1); }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 640px; margin: 0 auto; padding: 6px 6px calc(6px + var(--safe-b)); background: rgba(14, 16, 20, .9); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); border-top: 1px solid var(--line); }
.tab { position: relative; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--mut2); font-size: .7rem; font-weight: 600; border-radius: 14px; transition: color .2s; }
.tab .ic { width: 24px; height: 24px; transition: transform .2s; }
.tab.on { color: var(--text); }
.tab.on .ic { color: var(--a2); transform: translateY(-1px); }
.tab.on::before { content: ""; position: absolute; top: -6px; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--grad); }
.tab .dot { display: none; position: absolute; top: 8px; right: calc(50% - 18px); width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(61,220,151,.18); animation: pulse 1.6s infinite; }
.tab.live .dot { display: block; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(61,220,151,0); } }

/* ---------- primitives ---------- */
.card { display: block; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 0 0 12px; position: relative; }
.card h3 + p { margin-top: 4px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.btn { min-height: var(--tap); padding: 0 18px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: .95rem; transition: transform .1s, filter .15s, background .15s; user-select: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--grad); color: #140a02; box-shadow: 0 6px 22px rgba(255, 95, 31, .28); }
.btn.primary .ic { stroke-width: 2.4; }
.btn.ghost { background: var(--card2); border: 1px solid var(--line2); }
.btn.danger { background: var(--bad); color: #140a02; }
.btn.danger-ghost { background: rgba(255,84,104,.08); color: var(--bad); border: 1px solid rgba(255,84,104,.25); }
.btn.sm { min-height: 40px; padding: 0 14px; font-size: .85rem; border-radius: 12px; }
.btn.block { display: flex; width: 100%; margin-top: 10px; }
.btn.xl { min-height: 56px; font-size: 1.05rem; border-radius: 16px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; }
.btn-row > .btn { flex: 1; }
.btn-col .btn { margin-top: 8px; }
.btn-text { min-height: 40px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; color: var(--a2); font-weight: 600; font-size: .85rem; border-radius: 10px; }
.btn-text .ic { width: 18px; height: 18px; }
.btn-text:active { background: rgba(255,179,33,.08); }
.file-btn { cursor: pointer; }
.chips { display: flex; gap: 8px; }
.chips.wrap { flex-wrap: wrap; }
.scroll-x { overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 2px 14px; scroll-snap-type: x proximity; }
.scroll-x::-webkit-scrollbar { display: none; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line2); color: var(--mut); font-size: .85rem; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; scroll-snap-align: start; transition: all .15s; }
.chip.on { background: rgba(255, 122, 24, .14); border-color: rgba(255, 140, 30, .55); color: #ffc46b; }
.chip.on.neg { background: rgba(255,84,104,.12); border-color: rgba(255,84,104,.5); color: #ff8b98; text-decoration: line-through; }
.chip.static { min-height: 30px; padding: 0 12px; font-size: .78rem; cursor: default; }
.seg { display: flex; background: var(--card2); border: 1px solid var(--line2); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 42px; border-radius: 10px; font-weight: 700; font-size: .88rem; color: var(--mut); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; transition: all .15s; }
.seg button small { font-size: .68rem; font-weight: 600; opacity: .7; }
.seg button.on { background: var(--grad); color: #140a02; box-shadow: 0 3px 12px rgba(255,95,31,.25); }
.seg.big button { min-height: 56px; font-size: 1.2rem; }
.seg.sm button { min-height: 36px; font-size: .8rem; }
.seg.tabs { margin-bottom: 12px; position: sticky; top: calc(68px + var(--safe-t)); z-index: 5; background: rgba(26,30,37,.92); backdrop-filter: blur(10px); }
.banner { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--card2); border: 1px solid var(--line2); margin: 0 0 12px; font-size: .88rem; }
.banner > div { flex: 1; display: flex; flex-direction: column; }
.banner small { color: var(--mut); }
.banner.warn { background: rgba(255,179,33,.08); border-color: rgba(255,179,33,.3); color: #ffd58a; }
.banner.ok { background: rgba(61,220,151,.07); border-color: rgba(61,220,151,.28); color: #a6f0cf; }
.banner.deload { background: linear-gradient(135deg, rgba(255,95,31,.14), rgba(255,179,33,.08)); border-color: rgba(255,140,30,.4); }
.banner.deload .ic { color: var(--a2); }
.tag { font-style: normal; font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 3px 7px; border-radius: 6px; background: var(--line); color: var(--mut); }
.tag.stretch { background: rgba(61,220,151,.12); color: var(--ok); }
.badge { font-style: normal; font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-radius: 999px; white-space: nowrap; margin-left: 4px; vertical-align: middle; }
.badge.rec { background: var(--grad); color: #140a02; }
.badge.big { background: rgba(255,84,104,.15); color: #ff8b98; border: 1px solid rgba(255,84,104,.35); }
.badge.cur { background: rgba(61,220,151,.14); color: var(--ok); }
.badge.fit { background: var(--line); color: var(--text); }
.pr-badge { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: linear-gradient(135deg, rgba(255,95,31,.22), rgba(255,179,33,.22)); color: #ffcf73; white-space: nowrap; }
.pr-badge .ic { width: 13px; height: 13px; }
.empty { color: var(--mut); text-align: center; padding: 28px 16px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.facts > div { background: var(--card2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.facts small { color: var(--mut); font-size: .7rem; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.facts b { font-size: 1.02rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.section-title { margin: 22px 2px 10px; }
.select { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.select span, .form-grid label span { font-size: .72rem; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
:where(select, input:not([type=checkbox]):not([type=file]), textarea) { width: 100%; min-height: var(--tap); background: var(--card2); border: 1px solid var(--line2); border-radius: 12px; padding: 0 14px; outline: none; transition: border-color .15s; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--mut) 50%), linear-gradient(135deg, var(--mut) 50%, transparent 50%); background-position: calc(100% - 20px) 50%, calc(100% - 15px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
textarea { padding: 12px 14px; min-height: 72px; resize: vertical; }
:where(input, select, textarea):focus { border-color: var(--a1); }
input[type=date] { color-scheme: dark; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form-grid.one { grid-template-columns: 1fr; }
.form-grid label { display: flex; flex-direction: column; gap: 6px; }
.toggles { display: flex; flex-direction: column; gap: 2px; background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); cursor: pointer; }
.toggle:last-child { border-bottom: 0; }
.toggle span { display: flex; flex-direction: column; font-size: .92rem; }
.toggle small { color: var(--mut); }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle i { flex: none; width: 50px; height: 30px; border-radius: 999px; background: var(--line2); position: relative; transition: background .2s; }
.toggle i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.3,1.4,.6,1); }
.toggle input:checked + i { background: var(--grad); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { outline: 2px solid var(--a2); outline-offset: 2px; }
.search { position: relative; margin-bottom: 10px; }
.search .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--mut); width: 20px; height: 20px; }
.search input { padding-left: 44px; border-radius: 14px; }
.spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line2); border-top-color: var(--a2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- figures ---------- */
.fig { display: block; }
.fg-body line { stroke: #e9edf2; stroke-width: 5; stroke-linecap: round; }
.fg-head { fill: #e9edf2; }
.fg-load { fill: var(--a1); }
.fg-floor { stroke: var(--line2); stroke-width: 2; stroke-linecap: round; }
.fg-prop { fill: #2b313b; }
.fg-prop-l { stroke: #2b313b; stroke-width: 3; stroke-linecap: round; }
.fg-cable { stroke: var(--a2); stroke-width: 1.5; stroke-dasharray: 3 3; }

/* ---------- charts ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart-empty { color: var(--mut); text-align: center; padding: 34px 10px; font-size: .88rem; border: 1px dashed var(--line2); border-radius: 12px; margin: 8px 0; }
.ch-grid { stroke: var(--line); stroke-width: 1; }
.ch-lbl { fill: var(--mut2); font-size: 10px; font-family: var(--font); }
.ch-target { stroke: var(--ok); stroke-dasharray: 4 4; stroke-width: 1.5; }
.ch-tlbl { fill: var(--ok); font-size: 10px; font-weight: 700; }
.ch-dot { fill: #ff9a2a; }
.ch-row { fill: var(--text); font-size: 11.5px; font-weight: 600; font-family: var(--font); }
.ch-track { fill: #1d2129; }
.ch-band { fill: rgba(61, 220, 151, .14); stroke: rgba(61, 220, 151, .35); stroke-width: 1; }
.ch-bar.under { fill: #59606c; }
.ch-bar.over { fill: #ff8b98; }
.ch-val { font-size: 11.5px; font-weight: 800; fill: var(--ok); font-family: var(--font); }
.ch-val.under { fill: var(--mut); }
.ch-val.over { fill: #ff8b98; }
.gauge { width: 100%; max-width: 280px; display: block; margin: 0 auto; }
.g-val { fill: var(--text); font-size: 34px; font-weight: 800; font-family: var(--font); }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; }
.ring-txt { position: relative; text-align: center; line-height: 1.05; display: flex; flex-direction: column; }
.ring-txt b { font-size: 1.05rem; font-weight: 800; }
.ring-txt small { font-size: .6rem; color: var(--mut); text-transform: uppercase; letter-spacing: .05em; }

/* ---------- today ---------- */
.greet { padding: 4px 2px 14px; }
.greet small { color: var(--mut); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 14px 8px; }
.stat { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: .74rem; color: var(--mut); font-weight: 600; }
.stat span { display: inline-flex; align-items: center; gap: 4px; }
.stat .ic { width: 14px; height: 14px; color: var(--a2); }
.readiness .rd-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.readiness small { color: var(--mut); font-weight: 600; }
.rd-score { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; font-weight: 800; font-size: 1.1rem; background: var(--card2); border: 1px solid var(--line2); }
.rd-score.high { color: var(--ok); border-color: rgba(61,220,151,.4); }
.rd-score.low { color: var(--bad); border-color: rgba(255,84,104,.4); }
.readiness.done.high { border-color: rgba(61,220,151,.3); }
.readiness.done.low { border-color: rgba(255,84,104,.3); }
.rd-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
.rd-row > span { display: flex; flex-direction: column; font-weight: 700; font-size: .92rem; min-width: 74px; }
.rd-row > span small { font-weight: 500; font-size: .68rem; color: var(--mut2); }
.seg5 { display: flex; gap: 6px; }
.seg5 button { width: 44px; height: 44px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); font-weight: 700; color: var(--mut); transition: all .12s; }
.seg5 button.on { background: var(--grad); color: #140a02; border-color: transparent; transform: scale(1.05); }
.hero { background: radial-gradient(120% 80% at 100% 0%, rgba(255,95,31,.16), transparent 60%), var(--card); border-color: #2c2620; }
.hero-top { display: flex; justify-content: space-between; gap: 10px; }
.hero-top small { color: var(--a2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; }
.hero-top h2 { margin-top: 4px; font-size: 1.6rem; }
.hero-top p { margin: 2px 0 0; font-size: .86rem; }
.hero-meta { text-align: right; display: flex; flex-direction: column; flex: none; }
.hero-meta b { font-size: 1.3rem; }
.hero-meta small { color: var(--mut); }
.day-chips { display: flex; gap: 8px; margin: 14px -16px 4px; padding: 2px 16px; }
.ex-preview { list-style: none; padding: 0; margin: 10px 0 4px; }
.ex-preview li, .day-list li { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.ex-preview li:last-child, .day-list li:last-child { border-bottom: 0; }
.ex-preview li > div, .day-list li > div { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.ex-preview b, .day-list b { font-size: .93rem; font-weight: 650; }
.ex-preview small, .day-list small { color: var(--mut); }
.ex-preview .sg { color: var(--mut2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ex-preview .sg em { color: #ffc46b; font-style: normal; font-weight: 600; }
.mini-fig { width: 40px; height: 40px; flex: none; border-radius: 10px; background: #0f1216; border: 1px solid var(--line); display: grid; place-items: center; overflow: hidden; }
.gen-cta { display: flex; align-items: center; gap: 14px; color: var(--text); background: linear-gradient(135deg, rgba(255,95,31,.1), rgba(255,179,33,.04)), var(--card); }
.gen-cta > .ic:first-child { width: 42px; height: 42px; padding: 9px; border-radius: 12px; background: var(--grad); color: #140a02; }
.gen-cta div { flex: 1; display: flex; flex-direction: column; }
.gen-cta small { color: var(--mut); }
.gen-cta .ic:last-child { color: var(--mut); }
.tip { cursor: pointer; }
.tip > small:first-child { display: inline-flex; gap: 6px; align-items: center; color: var(--a2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; }
.tip > small .ic { width: 14px; height: 14px; }

/* ---------- session logger ---------- */
.session-head { position: sticky; top: calc(68px + var(--safe-t)); z-index: 6; display: flex; align-items: center; gap: 12px; margin: -12px -14px 0; padding: 12px 14px; background: rgba(11,13,16,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.session-head > div:first-child { flex: 1; min-width: 0; }
.session-head small { color: var(--a2); font-weight: 700; text-transform: uppercase; font-size: .68rem; letter-spacing: .06em; }
.session-head h2 { font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sh-clock { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; }
.sh-clock span { font-weight: 800; font-size: 1.1rem; }
.sh-clock small { color: var(--mut); text-transform: none; letter-spacing: 0; font-weight: 600; }
.progress { height: 4px; background: var(--line); border-radius: 4px; margin: 0 0 14px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--grad); border-radius: 4px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
.ex-card { padding: 14px 14px 8px; transition: border-color .3s; }
.ex-card.complete { border-color: rgba(61,220,151,.35); }
.ss-tag { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--a2); margin-bottom: 8px; }
.ss-tag .ic { width: 13px; height: 13px; }
.ex-head { display: flex; align-items: center; gap: 10px; }
.ex-fig { width: 56px; height: 56px; flex: none; border-radius: 14px; background: #0f1216; border: 1px solid var(--line); display: grid; place-items: center; }
.ex-title { flex: 1; min-width: 0; text-align: left; display: flex; flex-direction: column; min-height: var(--tap); justify-content: center; }
.ex-title h3 { font-size: 1rem; line-height: 1.2; }
.muscles { color: var(--mut); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sugg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 10px 0 2px; font-size: .84rem; color: var(--mut); }
.sugg b { color: var(--text); font-weight: 650; }
.sugg .arrow { color: var(--mut2); }
.sugg .next { color: #ffc46b; font-weight: 700; }
.sugg-note { font-size: .76rem; color: var(--ok); margin: 2px 0; }
.sugg-note.warn { color: var(--warn); }
.target-row { display: flex; gap: 12px; flex-wrap: wrap; font-size: .76rem; color: var(--mut2); font-weight: 600; margin: 4px 0 6px; }
.target-row span { display: inline-flex; align-items: center; gap: 4px; }
.target-row .ic { width: 14px; height: 14px; }
.warm { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--mut); background: rgba(255,179,33,.06); border: 1px dashed rgba(255,179,33,.25); border-radius: 10px; padding: 8px 10px; margin: 6px 0; }
.warm .ic { width: 15px; height: 15px; color: var(--a2); }
.sets { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
.set { border-radius: 14px; background: var(--card2); border: 1px solid var(--line); padding: 8px 10px; transition: background .2s, border-color .2s; }
.set.current { border-color: rgba(255,140,30,.45); box-shadow: 0 0 0 3px rgba(255,95,31,.08); }
.set.done { display: flex; align-items: center; gap: 10px; background: rgba(61,220,151,.06); border-color: rgba(61,220,151,.2); padding: 4px 6px 4px 10px; }
.set.done.editing { display: block; padding: 8px 10px; }
.set-no { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--line); font-weight: 800; font-size: .82rem; flex: none; }
.set.done .set-no { background: rgba(61,220,151,.18); color: var(--ok); }
.set-sum { flex: 1; min-height: 44px; display: flex; align-items: center; gap: 10px; text-align: left; flex-wrap: wrap; }
.set-sum b { font-size: .98rem; font-variant-numeric: tabular-nums; }
.set-sum small { color: var(--mut); }
.set-top { display: flex; align-items: center; gap: 10px; }
.set-prev { flex: 1; font-size: .78rem; color: var(--mut2); }
.set-prev b { color: var(--mut); font-weight: 650; }
.check { width: var(--tap); height: var(--tap); border-radius: 14px; display: grid; place-items: center; background: var(--line); color: var(--mut); flex: none; transition: all .15s; }
.check .ic { width: 24px; height: 24px; stroke-width: 2.8; }
.check:active { transform: scale(.92); }
.check.on { background: var(--ok); color: #05261a; }
.set.current .check:not(.on) { background: var(--grad); color: #140a02; }
.set-main { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 8px 0 6px; }
.stepper { display: flex; align-items: stretch; background: var(--bg); border: 1px solid var(--line2); border-radius: 13px; overflow: hidden; min-width: 0; }
.stepper button { width: 46px; min-height: var(--tap); display: grid; place-items: center; color: var(--text); flex: none; }
.stepper button:active { background: rgba(255,255,255,.08); }
.stepper .ic { width: 20px; height: 20px; }
.stepper label { flex: 1; display: flex; align-items: baseline; justify-content: center; gap: 3px; min-width: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
.stepper input { min-height: var(--tap); width: 100%; min-width: 0; padding: 0 2px; border: 0; outline: none; background: transparent; text-align: right; font-weight: 800; font-size: 1.08rem; font-variant-numeric: tabular-nums; border-radius: 0; flex: 1; }
.stepper small { color: var(--mut2); font-size: .7rem; font-weight: 600; flex: 1; text-align: left; }
.rir-row { display: flex; align-items: center; gap: 6px; }
.rir-row span { font-size: .7rem; font-weight: 800; color: var(--mut2); letter-spacing: .06em; width: 30px; }
.rir { flex: 1; min-height: 40px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); color: var(--mut); font-weight: 700; font-size: .85rem; }

.ex-foot { display: flex; justify-content: space-between; flex-wrap: wrap; margin: 6px -6px 0; }
.ex-note { margin: 4px 0 8px; }
.session-note { margin: 12px 0 0; }
.menu { display: flex; flex-direction: column; }
.menu button { min-height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 6px; border-bottom: 1px solid var(--line); font-weight: 600; text-align: left; }
.menu button:last-child { border-bottom: 0; }
.summary .sum-hero { text-align: center; padding: 6px 0 4px; }
.sum-hero .ic { width: 52px; height: 52px; padding: 12px; border-radius: 16px; background: var(--grad); color: #140a02; margin-bottom: 8px; }
.summary h3 { margin: 18px 0 8px; display: flex; align-items: center; gap: 8px; }
.summary .sum-hero h3 { justify-content: center; margin-top: 4px; }

.pr-list { list-style: none; padding: 0; margin: 0; }
.pr-list li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }

/* ---------- rest timer ---------- */
.rest { position: fixed; z-index: 40; left: 50%; bottom: calc(var(--tabh) + var(--safe-b) + 14px); transform: translate(-50%, 140%); transition: transform .35s cubic-bezier(.2,.9,.2,1.1); width: min(420px, calc(100% - 24px)); pointer-events: none; }
.rest.show { transform: translate(-50%, 0); pointer-events: auto; }
.rest-pill { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 10px; border-radius: 22px; background: rgba(28, 32, 39, .94); border: 1px solid var(--line2); box-shadow: 0 18px 50px rgba(0,0,0,.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); cursor: pointer; }
.rest.over .rest-pill { border-color: var(--ok); box-shadow: 0 0 0 4px rgba(61,220,151,.15), 0 18px 50px rgba(0,0,0,.5); }
.rest-mini { position: relative; width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
.rest-mini > svg:first-child { position: absolute; inset: 0; }
.rest-mini .ic { width: 16px; height: 16px; color: var(--a2); }
.rest-txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.rest-txt b { font-size: 1.25rem; font-variant-numeric: tabular-nums; font-weight: 800; line-height: 1.1; }
.rest.over .rest-txt b { color: var(--ok); }
.rest-txt small { color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill-btn { min-height: 44px; min-width: 52px; padding: 0 12px; border-radius: 14px; background: var(--line); font-weight: 700; font-size: .85rem; }
.pill-btn:last-child { background: var(--grad); color: #140a02; }
.rest.big { inset: 0; left: 0; bottom: 0; width: 100%; transform: none; background: rgba(8,9,12,.94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: grid; place-items: center; z-index: 60; }
.rest-big { width: min(360px, 92%); text-align: center; position: relative; padding-top: 30px; }
.rest-min { position: absolute; top: -20px; right: -6px; }
.rest-label { color: var(--mut); font-weight: 600; margin-bottom: 14px; }
.rest-ring { position: relative; width: 240px; height: 240px; margin: 0 auto 18px; display: grid; place-items: center; }
.rest-ring svg { position: absolute; inset: 0; }
.rest-time { font-size: 3.6rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.rest.over .rest-time { color: var(--ok); }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.6); opacity: 0; transition: opacity .25s; backdrop-filter: blur(2px); }
.sheet { position: relative; width: 100%; max-width: 640px; max-height: 88vh; max-height: 88dvh; display: flex; flex-direction: column; background: #111419; border: 1px solid var(--line2); border-bottom: 0; border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.9,.25,1); box-shadow: 0 -20px 60px rgba(0,0,0,.5); }
.sheet.tall { height: 88vh; height: 88dvh; }
.sheet-wrap.open .sheet { transform: none; }
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-handle { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 8px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 18px; flex: none; }
.sheet-head h2 { font-size: 1.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { overflow-y: auto; padding: 4px 18px calc(24px + var(--safe-b)); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.sheet-body > h3 { margin: 20px 0 8px; }
.ex-hero { display: grid; place-items: center; background: radial-gradient(70% 70% at 50% 40%, rgba(255,95,31,.12), transparent 70%), #0e1115; border: 1px solid var(--line); border-radius: 20px; padding: 12px; margin-bottom: 12px; }
.ex-hero .fg-body line { stroke-width: 4.5; }
.cue-list { margin: 0; padding-left: 0; list-style: none; }
.cue-list li { position: relative; padding: 7px 0 7px 26px; border-bottom: 1px solid var(--line); font-size: .92rem; }
.cue-list li::before { content: ""; position: absolute; left: 4px; top: 13px; width: 10px; height: 10px; border-radius: 50%; background: var(--grad); }
.cue-list.bad li::before { background: var(--bad); border-radius: 2px; transform: rotate(45deg); }
.checklist { display: flex; flex-direction: column; }
.chk { display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: .92rem; }
.chk input { width: 22px; height: 22px; accent-color: var(--a1); flex: none; }
.chk-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.yn { display: flex; gap: 6px; flex: none; }
.yn .chip { min-height: 40px; padding: 0 12px; }
.yn .chip[data-yn="1"].on { background: rgba(61,220,151,.15); border-color: rgba(61,220,151,.5); color: var(--ok); }
.yn .chip[data-yn="0"].on { background: rgba(255,84,104,.12); border-color: rgba(255,84,104,.5); color: #ff8b98; }
.pr-strip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .85rem; color: var(--mut); background: rgba(255,179,33,.06); border: 1px solid rgba(255,179,33,.2); border-radius: 12px; padding: 10px 12px; }
.pr-strip .ic { color: var(--a2); width: 18px; height: 18px; }
.pr-strip b { color: var(--text); }
.draft { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
.draft-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.dr-txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.dr-txt b { font-size: .9rem; }
.dr-txt small { color: var(--mut); }
.mini-step { display: flex; align-items: center; background: var(--card2); border: 1px solid var(--line2); border-radius: 12px; flex: none; }
.mini-step button { width: 36px; height: 44px; display: grid; place-items: center; }
.mini-step .ic { width: 16px; height: 16px; }
.mini-step b { min-width: 18px; text-align: center; }

/* ---------- library ---------- */
.lib-count { margin: 8px 2px; }
.lib-list { display: flex; flex-direction: column; gap: 8px; }
.lib-row { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px 8px 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-align: left; min-height: 64px; transition: border-color .15s, transform .1s; }

.lib-fig { width: 52px; height: 52px; flex: none; border-radius: 12px; background: #0f1216; border: 1px solid var(--line); display: grid; place-items: center; }
.lib-txt { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.lib-txt small { color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- plan ---------- */
.plan-hero small { color: var(--a2); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .7rem; }
.plan-hero .seg button.on small { color: inherit; opacity: 1; }
.plan-hero h2 { margin: 2px 0; }
.plan-hero .seg { margin-top: 12px; }
.day { padding: 0; overflow: hidden; }
.day-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; min-height: 64px; }
.day-head > div { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.day-head .ic { color: var(--mut); transition: transform .2s; }

.day-no { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--grad); color: #140a02; font-weight: 800; flex: none; }
.day-list { list-style: none; margin: 0; padding: 0 16px; border-top: 1px solid var(--line); }
.day .btn { margin: 8px 16px 16px; width: calc(100% - 32px); }
.sub-note { color: var(--a2) !important; font-size: .72rem; }
.ss { color: var(--a2); }
.prog.current { border-color: rgba(61,220,151,.35); }
.prog-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.prog-badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
.verdict { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(135deg, rgba(255,95,31,.12), rgba(255,179,33,.05)), var(--card); border-color: rgba(255,140,30,.3); }
.verdict > .ic { color: var(--a2); margin-top: 8px; }
.verdict p { margin: 4px 0; font-size: .92rem; }

/* ---------- history ---------- */
.week-label { display: flex; justify-content: space-between; color: var(--mut); font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; margin: 18px 4px 8px; }
.week-label:first-child { margin-top: 4px; }
.week-label span { color: var(--mut2); }
.sess { display: flex; align-items: center; gap: 14px; color: var(--text); padding: 12px 14px; margin-bottom: 8px; }
.sess-date { width: 46px; height: 50px; flex: none; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.sess-date b { font-size: 1.2rem; }
.sess-date small { color: var(--mut); font-size: .66rem; text-transform: uppercase; }

.sess-main small { color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hist-ex { padding: 10px 0; border-bottom: 1px solid var(--line); }

.hist-rows { list-style: none; margin: 0; padding: 0; }
.hist-rows li { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.hist-rows li span { color: var(--mut); width: 56px; flex: none; }

.hist-rows li small { color: #ffc46b; font-weight: 700; }
.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.week-nav div { text-align: center; display: flex; flex-direction: column; }
.week-nav small { color: var(--mut); }
.pr-table { list-style: none; margin: 0; padding: 0; }
.pr-table li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-height: 56px; }
.pr-table li > div:first-child { display: flex; flex-direction: column; min-width: 0; }

.pr-vals { display: flex; gap: 14px; flex: none; }
.pr-vals span { display: flex; flex-direction: column; align-items: flex-end; }
.pr-vals small { color: var(--mut2); font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; }
.pr-vals b { font-variant-numeric: tabular-nums; color: #ffc46b; }

/* ---------- body ---------- */
.taper { text-align: center; }
.taper .card-head { text-align: left; }
.body-form h3 { margin-bottom: 12px; }
.body-list { list-style: none; margin: 0; padding: 0; }
.body-list li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.body-list li > span:first-child { width: 56px; color: var(--mut); flex: none; }
.bl-vals { flex: 1; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.bl-vals small { color: var(--mut); }

/* ---------- toast & confetti ---------- */
#toast-root { position: fixed; z-index: 70; top: calc(12px + var(--safe-t)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { max-width: min(420px, calc(100% - 24px)); padding: 12px 16px; border-radius: 16px; background: rgba(30,34,42,.96); border: 1px solid var(--line2); box-shadow: 0 16px 40px rgba(0,0,0,.5); font-size: .9rem; font-weight: 600; transform: translateY(-20px) scale(.96); opacity: 0; transition: all .3s cubic-bezier(.2,.9,.25,1.2); backdrop-filter: blur(10px); }
.toast.show { transform: none; opacity: 1; }
.toast.ok { border-color: rgba(61,220,151,.4); }
.toast.err { border-color: rgba(255,84,104,.5); }
.toast.pr { background: linear-gradient(135deg, #2a1608, #2b2109); border-color: rgba(255,160,40,.6); text-align: center; }
.toast.pr .ic { width: 18px; height: 18px; color: var(--a2); vertical-align: -3px; margin-right: 4px; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 80; pointer-events: none; }

/* ---------- form check ---------- */
.fc { position: fixed; inset: 0; z-index: 65; background: var(--bg); overflow-y: auto; padding-bottom: calc(24px + var(--safe-b)); }
.fc-head { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: calc(8px + var(--safe-t)) 10px 8px; background: rgba(11,13,16,.92); backdrop-filter: blur(10px); }
.fc-head small { color: var(--a2); font-weight: 700; text-transform: uppercase; font-size: .68rem; letter-spacing: .06em; }
.fc-head h2 { font-size: 1.15rem; }
.fc-body { max-width: 640px; margin: 0 auto; padding: 8px 14px; }
.fc-intro { text-align: center; }
.fc-intro p { text-align: left; }
.fc-fig { display: grid; place-items: center; margin: 4px auto 10px; width: 140px; height: 140px; border-radius: 24px; background: radial-gradient(70% 70% at 50% 40%, rgba(255,95,31,.14), transparent 70%), #0e1115; border: 1px solid var(--line); }
.fc-stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border-radius: 18px; overflow: hidden; border: 1px solid var(--line2); }
.fc-stage video, .fc-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

    if (t.closest('[data-days]')) return set(() => { p.daysPerWeek = +t.closest('[data-days]').dataset.days; O.pick = null; });

    const t = e.target;
    const p = store.d.profile;
    if (t.dataset.f === 'name') p.name = t.value.trim();
    if (t.dataset.f === 'bw') { const v = parseFloat(t.value); if (v > 0) p.bw = round(fromDispW(v), 1); }
