<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Forge — offline-first hypertrophy coach for your home gym.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Forge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="onboard" hidden></div>
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="bmg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f1f"/><stop offset="1" stop-color="#ffb321"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#bmg)"/><path d="M14 26v12M20 20v24M44 20v24M50 26v12M20 32h24" stroke="#0b0d10" stroke-width="5.5" stroke-linecap="round"/></svg><h1 id="title">Today</h1></div>
      <button id="btn-settings" class="icon-btn" aria-label="Settings"></button>
    </header>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>
  </div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>Forge needs JavaScript enabled.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
